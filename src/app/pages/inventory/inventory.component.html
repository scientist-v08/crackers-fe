<div class="page-shell">
    <div class="page-container page-stack">
        <header class="page-header">
            <h1 class="page-title">Inventory</h1>
            <p class="page-subtitle">Track goods from order to receipt and unpacking</p>
            <div class="stat-banner">
                Total goods <strong>{{ goodsValueDivision() }}</strong>:
                <strong>₹{{ totalGoodsValue() }}</strong>
            </div>
        </header>

        <div class="content-card">
            <p-tabs [value]="activeTab()">
                <p-tablist>
                    <p-tab (click)="tabClicked(ordered)" value="0">Ordered</p-tab>
                    <p-tab (click)="tabClicked(received)" value="1">Received</p-tab>
                    <p-tab (click)="tabClicked(unpacked)" value="2">Unpacked</p-tab>
                </p-tablist>
                <p-tabpanels>
                    <p-tabpanel value="0">
                        @if (selectedTab() === ordered) {
                            <app-items />
                        }
                    </p-tabpanel>
                    <p-tabpanel value="1">
                        @if (selectedTab() === received) {
                            <app-items />
                        }
                    </p-tabpanel>
                    <p-tabpanel value="2">
                        @if (selectedTab() === unpacked) {
                            <app-items />
                        }
                    </p-tabpanel>
                </p-tabpanels>
            </p-tabs>
        </div>
    </div>
</div>
